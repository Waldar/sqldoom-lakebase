# SQLDoom on Lakebase (Databricks App): the package under src/ (sqldoom.server.app).
command: ["python", "-m", "sqldoom.server.app"]
env:
  - name: PYTHONPATH
    value: "src"
  # The production branch: the lobby (one row per game) and the menu's default rules.
  - name: LAKEBASE_ENDPOINT
    value: "projects/sqldoom-19/branches/production/endpoints/primary"
  # The Lakebase project (Postgres 19 since 2026-11-20; was projects/sqldoom, Postgres 17):
  # its game-template branch and every game's branch (sqldoom/lakebase/games.py).
  - name: LAKEBASE_PROJECT
    value: "projects/sqldoom-19"
  - name: DOOM_TEMPLATE_BRANCH
    value: "game-template"
  - name: LAKEBASE_DB
    value: "databricks_postgres"
  - name: LAKEBASE_SCHEMA
    value: "doom"
  # Size of a single-player game's branch (sqldoom/lakebase/games.py; 16 by default).
  # 16 CU since 2026-11-20 (24 since 2026-11-12): with frames rendered in the
  # app, 16 CU ran the same as 24 next to 3 render threads (frame p50 45 ms,
  # tic p50 24-25 ms on E1M9 combat, both sizes). The project default is 16
  # CU too, so a solo branch is born at its size; multiplayer (DOOM_MULTI_CU,
  # 32 by default) switches the default for its creation.
  - name: DOOM_SOLO_CU
    value: "16"
  # Render threads per player at page load (1 to 4; the page can change it, auto by default).
  - name: DOOM_RENDER_CONNS
    value: "4"
  # Status-bar cache writer (sqldoom/game/referee.py): check interval, 0 = off.
  - name: DOOM_HUD_INTERVAL_MS
    value: "100"
  - name: DOOM_MAX_FPS
    value: "35"
  # The referee runs as the shared owner of the doom schema (setup/doom_owner.sql).
  - name: DOOM_DB_ROLE
    value: "doom_owner"
  # Referee-driven VACUUM of the hot tic tables every 1050 tics (~30 s).
  # Turned off once (0) on 2026-10-22: fillfactor=10 alone did NOT hold,
  # player_state grew 4 -> 621 pages in ~2 h and frames slowed ~35%.
  - name: DOOM_VACUUM_INTERVAL
    value: "1050"
